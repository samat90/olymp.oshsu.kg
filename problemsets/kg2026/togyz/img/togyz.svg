<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="280" rx="12" fill="#f5ead7"/>
  <rect x="20" y="20" width="600" height="240" rx="18" fill="#c8945a" stroke="#6b4423" stroke-width="3"/>
  <!-- kazans -->
  <rect x="60" y="118" width="520" height="22" rx="11" fill="#8a5a2e"/>
  <text x="70" y="134" font-size="12" fill="#fff">казан Бакыта</text>
  <text x="570" y="134" font-size="12" fill="#fff" text-anchor="end">казан Айбека</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <!-- Bakyt's row: holes 18..10 from left to right (top) -->
    <g fill="#6b4423">
      <ellipse cx="72" cy="72" rx="22" ry="34"/><ellipse cx="134" cy="72" rx="22" ry="34"/><ellipse cx="196" cy="72" rx="22" ry="34"/>
      <ellipse cx="258" cy="72" rx="22" ry="34"/><ellipse cx="320" cy="72" rx="22" ry="34"/><ellipse cx="382" cy="72" rx="22" ry="34"/>
      <ellipse cx="444" cy="72" rx="22" ry="34"/><ellipse cx="506" cy="72" rx="22" ry="34"/><ellipse cx="568" cy="72" rx="22" ry="34"/>
    </g>
    <g fill="#f5ead7">
      <text x="72" y="76">18</text><text x="134" y="76">17</text><text x="196" y="76">16</text><text x="258" y="76">15</text>
      <text x="320" y="76">14</text><text x="382" y="76">13</text><text x="444" y="76">12</text><text x="506" y="76">11</text><text x="568" y="76">10</text>
    </g>
    <!-- Aibek's row: holes 1..9 (bottom) -->
    <g fill="#6b4423">
      <ellipse cx="72" cy="196" rx="22" ry="34"/><ellipse cx="134" cy="196" rx="22" ry="34"/><ellipse cx="196" cy="196" rx="22" ry="34"/>
      <ellipse cx="258" cy="196" rx="22" ry="34"/><ellipse cx="320" cy="196" rx="22" ry="34"/><ellipse cx="382" cy="196" rx="22" ry="34"/>
      <ellipse cx="444" cy="196" rx="22" ry="34"/><ellipse cx="506" cy="196" rx="22" ry="34"/><ellipse cx="568" cy="196" rx="22" ry="34"/>
    </g>
    <g fill="#f5ead7">
      <text x="72" y="200">1</text><text x="134" y="200">2</text><text x="196" y="200">3</text><text x="258" y="200">4</text>
      <text x="320" y="200">5</text><text x="382" y="200">6</text><text x="444" y="200">7</text><text x="506" y="200">8</text><text x="568" y="200">9</text>
    </g>
  </g>
  <g fill="none" stroke="#1f3a5f" stroke-width="2">
    <path d="M100 246 L540 246" marker-end="url(#m)"/>
    <path d="M600 190 Q616 134 600 80" marker-end="url(#m)"/>
    <path d="M540 28 L100 28" marker-end="url(#m)"/>
  </g>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1f3a5f"/></marker></defs>
  <text x="320" y="270" font-size="11" fill="#1f3a5f" text-anchor="middle">камни раскладываются по кругу: 1 → 2 → … → 9 → 10 → … → 18 → 1</text>
</svg>
