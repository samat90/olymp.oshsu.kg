    <circle cx="200" cy="44" r="15" fill="#c0392b"/><text x="200" y="49" fill="#fff">1</text>
    <circle cx="275" cy="62" r="15" fill="#2e86c1"/><text x="275" y="67" fill="#fff">2</text>
    <circle cx="325" cy="118" r="15" fill="#2e86c1"/><text x="325" y="123" fill="#fff">3</text>
    <circle cx="340" cy="190" r="15" fill="#c0392b"/><text x="340" y="195" fill="#fff">4</text>
    <circle cx="305" cy="256" r="15" fill="#d68910"/><text x="305" y="261" fill="#fff">5</text>
    <circle cx="240" cy="294" r="15" fill="#d68910"/><text x="240" y="299" fill="#fff">6</text>
    <circle cx="160" cy="294" r="15" fill="#d68910"/><text x="160" y="299" fill="#fff">7</text>
    <circle cx="95" cy="256" r="15" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/><text x="95" y="261" fill="#34495e">8</text>
    <circle cx="60" cy="190" r="15" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/><text x="60" y="195" fill="#34495e">9</text>
