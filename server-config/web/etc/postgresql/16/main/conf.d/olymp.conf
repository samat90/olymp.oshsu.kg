# PostgreSQL on the site machine: 4 GB of memory shared with gunicorn, Redis and nginx, database under 1 GB.
# Takes effect after a restart of postgresql (shared_buffers, max_connections).
max_connections = 100
shared_buffers = 384MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
# Virtual disk without seek penalty.
random_page_cost = 1.1
# Queries are short; compiling them costs more than it saves.
jit = off
