<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" font-family="Segoe UI, Arial, sans-serif">
  <rect width="600" height="270" rx="10" fill="#fbf5e8"/>
  <g stroke="#a0763a" stroke-width="4" stroke-dasharray="10 6">
    <line x1="80" y1="135" x2="230" y2="135"/>
    <line x1="230" y1="135" x2="360" y2="60"/>
    <line x1="230" y1="135" x2="360" y2="210"/>
    <line x1="360" y1="210" x2="510" y2="210"/>
  </g>
  <g font-size="12" fill="#5b3a12">
    <text x="140" y="125">10 км</text><text x="285" y="85">3 км</text><text x="270" y="190">6 км</text><text x="420" y="200">5 км</text>
  </g>
  <g text-anchor="middle">
    <circle cx="80" cy="135" r="26" fill="#c0392b"/><text x="80" y="141" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="80" y="182" font-size="13" fill="#5b3a12" font-weight="700">Ош</text>
    <circle cx="230" cy="135" r="20" fill="#fff" stroke="#7d5a23" stroke-width="3"/><text x="230" y="141" font-size="14" font-weight="700" fill="#7d5a23">2</text>
    <text x="230" y="176" font-size="11" fill="#5b3a12">S=5, V=2</text>
    <circle cx="360" cy="60" r="20" fill="#fff" stroke="#7d5a23" stroke-width="3"/><text x="360" y="66" font-size="14" font-weight="700" fill="#7d5a23">3</text>
    <text x="440" y="64" font-size="11" fill="#5b3a12">S=4, V=10</text>
    <circle cx="360" cy="210" r="20" fill="#fff" stroke="#7d5a23" stroke-width="3"/><text x="360" y="216" font-size="14" font-weight="700" fill="#7d5a23">4</text>
    <text x="360" y="252" font-size="11" fill="#5b3a12">S=20, V=1</text>
    <circle cx="510" cy="210" r="20" fill="#fff" stroke="#7d5a23" stroke-width="3"/><text x="510" y="216" font-size="14" font-weight="700" fill="#7d5a23">5</text>
    <text x="510" y="252" font-size="11" fill="#5b3a12">S=0, V=7</text>
