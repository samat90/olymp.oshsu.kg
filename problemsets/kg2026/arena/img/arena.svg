  <g font-size="13" fill="#24364a">
    <circle cx="380" cy="120" r="8" fill="#c0392b"/><text x="395" y="125">занято (1–4)</text>
    <circle cx="380" cy="148" r="8" fill="#d68910"/><text x="395" y="153">занято (5–7)</text>
    <circle cx="380" cy="176" r="8" fill="#2e86c1"/><text x="395" y="181">билеты сданы</text>
    <circle cx="380" cy="204" r="8" fill="#ffffff" stroke="#7f8c8d" stroke-width="2"/><text x="395" y="209">свободно</text>
    <text x="372" y="250" font-size="12" fill="#55657a">После четырёх событий</text>
    <text x="372" y="266" font-size="12" fill="#55657a">примера: кресло 10</text>
    <text x="372" y="282" font-size="12" fill="#55657a">соседствует с креслом 1</text>
