<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="330" fill="#f4f8fc" rx="10"/>
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b79c"/>
      <stop offset="1" stop-color="#8f7a5c"/>
    </linearGradient>
  </defs>
  <!-- Five peaks of Sulaiman-Too -->
  <path d="M20 300 L110 190 L150 215 L230 95 L290 160 L330 120 L400 60 L470 150 L520 130 L620 300 Z" fill="url(#rock)" stroke="#6d5b43" stroke-width="2"/>
  <path d="M380 82 L400 60 L420 86 L408 80 L400 90 L392 80 Z" fill="#ffffff" opacity="0.8"/>
  <!-- City of Osh at the foot -->
  <g fill="#7d8fa3">
    <rect x="30" y="285" width="16" height="15"/><rect x="50" y="279" width="12" height="21"/>
    <rect x="560" y="283" width="18" height="17"/><rect x="582" y="276" width="12" height="24"/>
  </g>
  <!-- Trails -->
  <g stroke="#b5462f" stroke-width="3" stroke-dasharray="7 5" fill="none">
    <path d="M120 255 L230 120"/>
    <path d="M230 120 L150 210"/>
    <path d="M230 120 L400 80"/>
    <path d="M400 80 L330 140"/>
    <path d="M400 80 L500 165"/>
  </g>
  <!-- Viewpoints: number and height -->
  <g font-size="15" text-anchor="middle">
    <circle cx="120" cy="255" r="17" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="120" y="260" font-weight="700" fill="#1f5fa8">1</text>
    <text x="120" y="292" fill="#203040">h = 3</text>
    <circle cx="230" cy="120" r="17" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="230" y="125" font-weight="700" fill="#1f5fa8">2</text>
    <text x="230" y="86" fill="#203040">h = 7</text>
    <circle cx="150" cy="210" r="17" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="150" y="215" font-weight="700" fill="#1f5fa8">3</text>
    <text x="96" y="205" fill="#203040">h = 2</text>
    <circle cx="400" cy="80" r="17" fill="#ffd34d" stroke="#1f5fa8" stroke-width="3"/><text x="400" y="85" font-weight="700" fill="#1f5fa8">4</text>
    <text x="400" y="45" fill="#203040">h = 7</text>
    <circle cx="330" cy="140" r="17" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="330" y="145" font-weight="700" fill="#1f5fa8">5</text>
    <text x="330" y="182" fill="#203040">h = 5</text>
    <circle cx="500" cy="165" r="17" fill="#ffffff" stroke="#1f5fa8" stroke-width="3"/><text x="500" y="170" font-weight="700" fill="#1f5fa8">6</text>
    <text x="500" y="207" fill="#203040">h = 1</text>
  </g>
  <text x="620" y="24" font-size="13" text-anchor="end" fill="#55657a">Тропы и смотровые площадки из примера</text>
</svg>
