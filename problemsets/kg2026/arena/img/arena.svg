<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="Segoe UI, Arial, sans-serif">
  <rect width="520" height="330" rx="10" fill="#f6f8fb"/>
  <!-- yurt-shaped roof (tunduk) -->
