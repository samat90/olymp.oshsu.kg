  <circle cx="200" cy="168" r="14" fill="none" stroke="#ffffff" stroke-width="2"/>
  <g stroke="#8a6d3b" stroke-width="1" opacity="0.6">
    <path d="M200 36 L200 80 M200 256 L200 300 M50 168 L96 168 M304 168 L350 168"/>
    <path d="M94 75 L126 105 M306 75 L274 105 M94 261 L126 231 M306 261 L274 231"/>
  </g>
