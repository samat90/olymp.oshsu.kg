{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}{{ block.super }}
    <script src="{% static 'infinite-scroll.js' %}?v={{ STATIC_VERSION }}" defer></script>
    <script>
        // Sync admin dark mode with main site preference (oshsu-theme localStorage).
        (function() {
            try {
                var t = localStorage.getItem('oshsu-theme') || 'auto';
                var html = document.documentElement;
                if (t === 'dark') html.dataset.theme = 'dark';
                else if (t === 'light') html.dataset.theme = 'light';
                // 'auto' uses prefers-color-scheme via Django's dark_mode.css media query
            } catch (e) {}
        })();
    </script>
{% endblock %}

{% block pretitle %}{{ block.super }}
    <form style="display: none" id="empty-action-form" method="post">
        {% csrf_token %}
    </form>
    <script>
        // The admin theme still calls the old jQuery actions plugin; Django's actions.js starts by itself.
        if (window.django && django.jQuery && !django.jQuery.fn.actions) django.jQuery.fn.actions = function () { return this; };
        // The login page has no django.jQuery.
        window.django && django.jQuery && django.jQuery(function ($) {
            $(document).on('click', '.action-link', function () {
                $('#empty-action-form').attr('action', this.href).trigger('submit');
                return false;
            });
        });
    </script>
{% endblock %}
