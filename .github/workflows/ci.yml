name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: dmoj.ci_settings
  CI_DB_HOST: 127.0.0.1
  CI_DB_PASSWORD: postgres

jobs:
  django:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olymp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: Lint (only real errors, style is not checked)
        run: git ls-files '*.py' | xargs flake8 --isolated --select=E9,F63,F7,F82
      - name: Django system check
        run: python manage.py check
      - name: Every model change has a migration
        run: bash scripts/dev/check_migrations.sh
      - name: Apply all migrations on PostgreSQL
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test judge --noinput --parallel 1

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck (errors only; old scripts have warnings)
        run: |
          files=$(git ls-files 'scripts/*.sh' 'scripts/**/*.sh' scripts/server/post-receive | sort -u)
          for f in $files; do bash -n "$f"; done
          shellcheck --severity=error $files
