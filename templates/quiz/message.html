{% extends "base.html" %}

{% block title_row %}{% endblock %}
{% block title_ruler %}{% endblock %}

{% block media %}
    <link rel="stylesheet" href="{{ static('quiz/quiz.css') }}?v={{ STATIC_VERSION }}">
{% endblock %}

{% block body %}
<div class="qz qz-message">
    <div class="qz-panel qz-message-box">
        <div class="qz-message-icon" aria-hidden="true"><i class="fa fa-info-circle"></i></div>
        <p class="qz-message-text">{{ message }}</p>
        <div class="qz-actions">
            {% if back %}<a class="qz-btn qz-btn-primary" href="{{ back }}">Назад</a>{% endif %}
            <a class="qz-btn" href="{{ url('quiz_catalog') }}">Каталог викторин</a>
        </div>
    </div>
</div>
{% endblock %}
