{% if request.in_contest and request.participation.contest.logo_override_image %}
    <img src="{{ request.participation.contest.logo_override_image|camo }}" alt="{{ SITE_NAME }}" height="40" style="border: none">
{% elif logo_override_image is defined and logo_override_image %}
    <img src="{{ logo_override_image|camo }}" alt="{{ SITE_NAME }}" height="40" style="border: none">
{% else %}
    <span class="brand-lockup" aria-label="{{ SITE_NAME }}">
        <img src="{{ static('icons/oshsu-badge.svg') }}" alt="" class="brand-icon" width="40" height="36">
        <span class="brand-wordmark">
            <span class="brand-name">OshSU</span><span class="brand-name-accent">Olymp</span>
        </span>
    </span>
{% endif %}
